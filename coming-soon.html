<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon | Surfboard Workshop</title>
    <meta name="description" content="We are shaping something special. Our new workshop website is coming soon.">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
    <link rel="stylesheet" href="assets/css/rtl.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: var(--font-body);
        }
        .coming-soon {
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1542362567-b07e54358753?auto=format&fit=crop&q=80&w=1600') center/cover no-repeat;
            color: var(--white);
            padding: 20px;
        }
        .cs-logo {
            width: 80px;
            margin-bottom: 30px;
            filter: brightness(0) invert(1);
        }
        .cs-title {
            font-size: 4rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--accent);
        }
        .cs-subtitle {
            font-size: 1.5rem;
            margin-bottom: 40px;
            max-width: 600px;
        }
        .countdown {
            display: flex;
            gap: 20px;
            margin-bottom: 50px;
        }
        .count-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: var(--radius);
            min-width: 100px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .count-num {
            font-size: 2.5rem;
            font-weight: 700;
        }
        .count-label {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.8;
        }
        .newsletter-box {
            background: rgba(255,255,255,1);
            padding: 10px;
            border-radius: 50px;
            display: flex;
            width: 100%;
            max-width: 500px;
        }
        .newsletter-box input {
            border: none;
            background: none;
            padding: 15px 25px;
            flex: 1;
            outline: none;
            font-size: 1rem;
        }
        .newsletter-box button {
            background: var(--accent);
            color: var(--white);
            border: none;
            padding: 0 30px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }
        .newsletter-box button:hover {
            background: var(--primary);
        }
        .social-links {
            margin-top: 50px;
            display: flex;
            gap: 20px;
        }
        .social-links a {
            color: var(--white);
            font-size: 1.5rem;
            transition: var(--transition);
        }
        .social-links a:hover {
            color: var(--accent);
            transform: translateY(-5px);
        }

        @media (max-width: 768px) {
            .cs-title { font-size: 2.5rem; }
            .cs-subtitle { font-size: 1.1rem; }
            .countdown { gap: 10px; }
            .count-item { min-width: 70px; padding: 15px; }
            .count-num { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <div class="coming-soon" style="background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1542362567-b07e54358753?auto=format&fit=crop&q=80&w=1600');">
        <a href="index.html" class="logo-link">
            <img src="https://icon2.cleanpng.com/lnd/20240507/kuj/avocms720.webp" alt="Logo" class="cs-logo">
        </a>
        <h1 class="cs-title">Something Special is Shaping</h1>
        <p class="cs-subtitle">We are currently in the workshop sanding down the edges of our new online home. Stay tuned for the swell!</p>
        
        <div class="countdown">
            <div class="count-item">
                <span class="count-num" id="days">14</span>
                <span class="count-label">Days</span>
            </div>
            <div class="count-item">
                <span class="count-num" id="hours">08</span>
                <span class="count-label">Hours</span>
            </div>
            <div class="count-item">
                <span class="count-num" id="minutes">45</span>
                <span class="count-label">Mins</span>
            </div>
            <div class="count-item">
                <span class="count-num" id="seconds">32</span>
                <span class="count-label">Secs</span>
            </div>
        </div>

        <form class="newsletter-box" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
            <input type="email" name="email" placeholder="Get notified when we launch..." required>
            <button type="submit">Notify Me</button>
        </form>

        <div class="social-links">
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-facebook"></i></a>
            <a href="#"><i class="fab fa-twitter"></i></a>
            <a href="#"><i class="fab fa-youtube"></i></a>
        </div>
    </div>

    <script>
        // Simple countdown timer
        const targetDate = new Date();
        targetDate.setDate(targetDate.getDate() + 14);

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerHTML = days.toString().padStart(2, '0');
            document.getElementById("hours").innerHTML = hours.toString().padStart(2, '0');
            document.getElementById("minutes").innerHTML = minutes.toString().padStart(2, '0');
            document.getElementById("seconds").innerHTML = seconds.toString().padStart(2, '0');
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
