<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon | Surfboard Workshop</title>
    <meta name="description" content="We are shaping something special. Our new workshop website is coming soon.">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><linearGradient id='lg' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='%23C47A2C'/><stop offset='100%' stop-color='%23F2C582'/></linearGradient><circle cx='50' cy='50' r='46' fill='none' stroke='url(%23lg)' stroke-width='1.5' stroke-opacity='0.25' stroke-dasharray='4 4'/><path d='M22,72 C32,72 45,62 54,48 C63,34 76,26 86,30 C74,18 58,18 48,30 C38,42 28,60 18,62 Z' fill='url(%23lg)'/><path d='M30,80 C40,80 50,70 58,58 C66,46 76,40 84,43 C74,31 62,33 54,44 C46,55 36,70 26,72 Z' fill='url(%23lg)' fill-opacity='0.4'/><g transform='rotate(-25, 50, 50)'><path d='M50,16 C42,30 40,56 50,80 Z' fill='%23A05A19'/><path d='M50,16 C58,30 60,56 50,80 Z' fill='url(%23lg)'/><line x1='50' y1='16' x2='50' y2='80' stroke='%23fff' stroke-width='1.5'/></g></svg>">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
    <link rel="stylesheet" href="assets/css/rtl.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: var(--font-body);
        }
        .coming-soon {
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1542362567-b07e54358753?auto=format&fit=crop&q=80&w=1600') center/cover no-repeat;
            color: var(--white);
            padding: 20px;
        }
        .cs-logo {
            width: 80px;
            margin-bottom: 30px;
        }
        .cs-title {
            font-size: 4rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--accent);
        }
        .cs-subtitle {
            font-size: 1.5rem;
            margin-bottom: 40px;
            max-width: 600px;
        }
        .countdown {
            display: flex;
            gap: 20px;
            margin-bottom: 50px;
        }
        .count-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: var(--radius);
            min-width: 100px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .count-num {
            font-size: 2.5rem;
            font-weight: 700;
        }
        .count-label {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.8;
        }
        .newsletter-box {
            background: rgba(255,255,255,1);
            padding: 10px;
            border-radius: 50px;
            display: flex;
            width: 100%;
            max-width: 500px;
        }
        .newsletter-box input {
            border: none;
            background: none;
            padding: 15px 25px;
            flex: 1;
            outline: none;
            font-size: 1rem;
        }
        .newsletter-box button {
            background: var(--accent);
            color: var(--white);
            border: none;
            padding: 0 30px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }
        .newsletter-box button:hover {
            background: var(--primary);
        }
        .social-links {
            margin-top: 50px;
            display: flex;
            gap: 20px;
        }
        .social-links a {
            color: var(--white);
            font-size: 1.5rem;
            transition: var(--transition);
        }
        .social-links a:hover {
            color: var(--accent);
            transform: translateY(-5px);
        }

        @media (max-width: 768px) {
            .cs-title { font-size: 2.5rem; }
            .cs-subtitle { font-size: 1.1rem; }
            .countdown { gap: 10px; }
            .count-item { min-width: 70px; padding: 15px; }
            .count-num { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <div class="coming-soon" style="background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1542362567-b07e54358753?auto=format&fit=crop&q=80&w=1600');">
        <a href="index.html" class="logo-link">
            <svg class="cs-logo" viewBox="0 0 100 100" style="width: 80px; height: 80px; margin-bottom: 30px;">
                <defs>
                    <linearGradient id="logo-grad-cs" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#C47A2C" />
                        <stop offset="40%" stop-color="#DE9447" />
                        <stop offset="100%" stop-color="#F9D29F" />
                    </linearGradient>
                    <filter id="shadow-cs" x="-20%" y="-20%" width="140%" height="140%">
                        <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
                    </filter>
                </defs>
                <circle cx="50" cy="50" r="45" fill="none" stroke="url(#logo-grad-cs)" stroke-width="3" stroke-linecap="round" />
                <path d="M 15,65 C 25,65 35,50 48,38 C 58,28 72,25 83,32 C 70,15 54,16 43,28 C 32,40 22,55 15,55 Z" fill="url(#logo-grad-cs)" filter="url(#shadow-cs)" />
                <path d="M 22,75 C 32,75 42,62 52,50 C 62,38 74,34 82,39 C 71,25 58,26 49,38 C 40,50 30,65 22,65 Z" fill="url(#logo-grad-cs)" fill-opacity="0.45" />
                <g transform="rotate(-20, 50, 50)" filter="url(#shadow-cs)">
                    <path d="M 50,8 C 38,28 36,68 50,92 Z" fill="#914D12" />
                    <path d="M 50,8 C 62,28 64,68 50,92 Z" fill="url(#logo-grad-cs)" />
                    <line x1="50" y1="8" x2="50" y2="92" stroke="#FFFFFF" stroke-width="2" />
                    <line x1="44" y1="58" x2="56" y2="58" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8" />
                    <line x1="43" y1="66" x2="57" y2="66" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8" />
                </g>
            </svg>
        </a>
        <h1 class="cs-title">Something Special is Shaping</h1>
        <p class="cs-subtitle">We are currently in the workshop sanding down the edges of our new online home. Stay tuned for the swell!</p>
        
        <div class="countdown">
            <div class="count-item">
                <span class="count-num" id="days">14</span>
                <span class="count-label">Days</span>
            </div>
            <div class="count-item">
                <span class="count-num" id="hours">08</span>
                <span class="count-label">Hours</span>
            </div>
            <div class="count-item">
                <span class="count-num" id="minutes">45</span>
                <span class="count-label">Mins</span>
            </div>
            <div class="count-item">
                <span class="count-num" id="seconds">32</span>
                <span class="count-label">Secs</span>
            </div>
        </div>

        <form class="newsletter-box" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
            <input type="email" name="email" placeholder="Get notified when we launch..." required>
            <button type="submit">Notify Me</button>
        </form>

        <div class="social-links">
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-facebook"></i></a>
            <a href="#"><i class="fab fa-twitter"></i></a>
            <a href="#"><i class="fab fa-youtube"></i></a>
        </div>
    </div>

    <script>
        // Simple countdown timer
        const targetDate = new Date();
        targetDate.setDate(targetDate.getDate() + 14);

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerHTML = days.toString().padStart(2, '0');
            document.getElementById("hours").innerHTML = hours.toString().padStart(2, '0');
            document.getElementById("minutes").innerHTML = minutes.toString().padStart(2, '0');
            document.getElementById("seconds").innerHTML = seconds.toString().padStart(2, '0');
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
