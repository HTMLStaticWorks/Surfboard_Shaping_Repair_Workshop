<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Surfboard Workshop</title>
  <meta name="description" content="Create a Surfboard Workshop account to track your custom board builds and repair status.">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dark-mode.css">
  <link rel="stylesheet" href="../assets/css/rtl.css">
  <style>
    /* ── Auth Page Layout ── */
    body { min-height:100vh; display:flex; align-items:center; justify-content:center;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #2a1a0a 100%); }

    /* Top-right controls (outside card) */
    .auth-controls {
      position:fixed; top:20px; right:24px; display:flex; gap:12px; z-index:100;
    }
    .auth-controls .icon-btn { color:#fff; font-size:1.2rem; background:rgba(255,255,255,.12);
      border-radius:50%; width:42px; height:42px; display:flex; align-items:center; justify-content:center; }
    .auth-controls .icon-btn:hover { background:var(--accent); }

    /* Auth Card */
    .auth-card {
      background:#fff; border-radius:20px; padding:40px 48px; width:100%;
      max-width:440px; box-shadow:0 20px 60px rgba(0,0,0,.4);
      margin: 20px;
    }

    .auth-brand { display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:24px; }
    .auth-brand img { width:52px; }
    .auth-brand span { font-family:var(--font-heading); font-weight:700; font-size:1.5rem; color:var(--primary); }

    .auth-title { text-align:center; font-size:1.6rem; margin-bottom:8px; }
    .auth-sub   { text-align:center; color:var(--gray); font-size:.92rem; margin-bottom:24px; }

    .form-group { margin-bottom:16px; }
    .form-group label { display:block; font-weight:600; font-size:.9rem; margin-bottom:6px; }
    .form-group .input-wrap { position:relative; }
    .form-group input { width:100%; padding:12px 44px 12px 14px; border:2px solid #eee;
      border-radius:10px; font-size:1rem; font-family:var(--font-body); transition:var(--transition); }
    .form-group input:focus { outline:none; border-color:var(--accent); }
    .input-icon { position:absolute; right:14px; top:50%; transform:translateY(-50%); color:var(--gray); }
    .toggle-pw { cursor:pointer; }
    .error-msg { color:#e53e3e; font-size:.8rem; margin-top:4px; display:none; }
    .invalid input { border-color:#e53e3e; }
    .invalid .error-msg { display:block; }

    .terms-group { display:flex; gap:10px; align-items:flex-start; margin:16px 0; font-size:.85rem; color:var(--gray); }
    .terms-group input { margin-top:3px; }
    .terms-group a { color:var(--accent); font-weight:600; }

    .btn-auth { width:100%; padding:14px; font-size:1rem; border-radius:10px; margin-top:8px; }
    .divider { display:flex; align-items:center; gap:12px; margin:20px 0; color:var(--gray); font-size:.88rem; }
    .divider::before, .divider::after { content:''; flex:1; height:1px; background:#eee; }

    .btn-social { width:100%; padding:12px; border-radius:10px; border:2px solid #eee;
      background:#fff; font-size:.95rem; font-weight:600; cursor:pointer; display:flex;
      align-items:center; justify-content:center; gap:10px; transition:var(--transition); margin-bottom:12px; }
    .btn-social:hover { border-color:var(--accent); background:#faf8f5; }
    .btn-social img { width:18px; height:18px; }

    .auth-footer { text-align:center; margin-top:20px; font-size:.9rem; color:var(--gray); }
    .auth-footer a { color:var(--accent); font-weight:600; }

    @media(max-width:480px){ .auth-card { padding:32px 24px; } }
  </style>
</head>
<body>

  <!-- Top-right controls (outside card) -->
  <div class="auth-controls">
    <button class="icon-btn" id="rtl-toggle" title="Toggle RTL"><i class="fas fa-language"></i></button>
    <button class="icon-btn" id="theme-toggle" title="Toggle Theme"><i class="fas fa-moon theme-icon"></i></button>
  </div>

  <!-- Auth Card -->
  <div class="auth-card">

    <!-- Brand Logo & Name -->
    <div class="auth-brand">
      <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0iI0M0N0EyQyI+PHBhdGggZD0iTTEyIDJDOCAyIDUgOCA1IDE2QzUgMTkgNyAyMiAxMSAyMkgxM0MxNyAyMiAxOSAxOSAxOSAxNkMxOSA4IDE2IDIgMTIgMlpNMTEuNSAyMEM5LjUgMjAgNyAxOC41IDcgMTZDNyAxMSAxMCA0IDEyIDRDMTQgNCAxNyAxMSAxNyAxNkMxNyAxOC41IDE0LjUgMjAgMTIuNSAyMEgxMS41WiIvPjwvc3ZnPg==" alt="Surfboard Logo">
      <span>SURFBOARD</span>
    </div>

    <h1 class="auth-title">Create Account</h1>
    <p class="auth-sub">Join the Surfboard workshop community</p>

    <form id="register-form" novalidate>
      <div class="form-group" id="grp-name">
        <label for="name">Full Name</label>
        <div class="input-wrap">
          <input type="text" id="name" name="name" placeholder="John Doe">
          <i class="fas fa-user input-icon"></i>
        </div>
        <div class="error-msg">Please enter your name.</div>
      </div>

      <div class="form-group" id="grp-email">
        <label for="email">Email Address</label>
        <div class="input-wrap">
          <input type="email" id="email" name="email" placeholder="you@example.com">
          <i class="fas fa-envelope input-icon"></i>
        </div>
        <div class="error-msg">Enter a valid email address.</div>
      </div>

      <div class="form-group" id="grp-pw">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input type="password" id="password" name="password" placeholder="••••••••">
          <i class="fas fa-eye input-icon toggle-pw" id="toggle-pw"></i>
        </div>
        <div class="error-msg">Password must be at least 6 characters.</div>
      </div>

      <div class="form-group" id="grp-cpw">
        <label for="confirm-password">Confirm Password</label>
        <div class="input-wrap">
          <input type="password" id="confirm-password" name="confirm-password" placeholder="••••••••">
          <i class="fas fa-lock input-icon"></i>
        </div>
        <div class="error-msg">Passwords do not match.</div>
      </div>

      <div class="terms-group" id="grp-terms">
        <input type="checkbox" id="terms" name="terms">
        <label for="terms">I accept the <a href="#">Terms & Conditions</a></label>
      </div>
      <div class="error-msg" style="display:none; color:#e53e3e; font-size:.8rem; margin-top:-10px; margin-bottom:10px;" id="terms-error">You must accept the terms.</div>

      <button type="submit" class="btn btn-primary btn-auth">
        <i class="fas fa-user-plus"></i> Register
      </button>
    </form>

    <div class="divider">or register with</div>

    <button class="btn-social">
      <img src="https://cdn-icons-png.flaticon.com/512/0/747.png" alt="Apple">
      Continue with Apple
    </button>
    <button class="btn-social">
      <img src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png" alt="Email">
      Continue with Email
    </button>

    <div class="auth-footer">
      Already have an account? <a href="login.html">Login here</a>
    </div>
  </div>

  <script src="../assets/js/main.js"></script>
  <script>
    // Password visibility toggle
    document.getElementById('toggle-pw').addEventListener('click', function(){
      const pw = document.getElementById('password');
      pw.type = pw.type === 'password' ? 'text' : 'password';
      this.className = pw.type === 'password' ? 'fas fa-eye input-icon toggle-pw' : 'fas fa-eye-slash input-icon toggle-pw';
    });

    // Register validation
    document.getElementById('register-form').addEventListener('submit', function(e){
      e.preventDefault();
      let ok = true;
      
      const name = document.getElementById('name');
      const email = document.getElementById('email');
      const pw = document.getElementById('password');
      const cpw = document.getElementById('confirm-password');
      const terms = document.getElementById('terms');
      
      const gN = document.getElementById('grp-name');
      const gE = document.getElementById('grp-email');
      const gP = document.getElementById('grp-pw');
      const gC = document.getElementById('grp-cpw');
      const te = document.getElementById('terms-error');

      if(name.value.trim() === ""){ gN.classList.add('invalid'); ok=false; } else gN.classList.remove('invalid');
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value)){ gE.classList.add('invalid'); ok=false; } else gE.classList.remove('invalid');
      if(pw.value.length < 6){ gP.classList.add('invalid'); ok=false; } else gP.classList.remove('invalid');
      if(cpw.value !== pw.value || cpw.value === ""){ gC.classList.add('invalid'); ok=false; } else gC.classList.remove('invalid');
      if(!terms.checked){ te.style.display = 'block'; ok=false; } else te.style.display = 'none';

      if(ok) alert('Registration successful! Redirecting to login...');
    });
  </script>
</body>
</html>
